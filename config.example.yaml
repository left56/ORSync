# ORSync 配置实例：复制为 config.yaml 后填入真实值，或通过等价环境变量提供（见 internal/config）。
# 必填项不可为空，否则 config.Load() 会报错。
#
# 指定本文件路径的两种方式（任选其一，命令行优先于环境变量）：
#   ./orsync -config /绝对或相对路径/config.yaml
#   export ORSYNC_CONFIG_FILE=/path/to/config.yaml && ./orsync

server:
  addr: ":8080"

database:
  path: "orsync.db"

outline:
  base_url: "https://your-outline-host.example.com"
  api_key: "ol_api_replace_me"

ragflow:
  base_url: "http://127.0.0.1:9380"
  api_key: "replace_ragflow_api_key"
  dataset_id: "replace_dataset_id"

# 留空表示不在 Webhook 层校验密钥（若实现校验后再填写）
webhook:
  secret: ""
